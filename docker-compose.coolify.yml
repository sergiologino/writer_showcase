services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-publisher}
      POSTGRES_USER: ${POSTGRES_USER:-publisher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - publisher_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-publisher} -d $${POSTGRES_DB:-publisher}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - publisher_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-publisher}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-publisher}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PUBLIC_SITE_BASE_URL: ${PUBLIC_SITE_BASE_URL:-https://myposts.pro}
      PUBLISHER_OAUTH2_FRONTEND_URL: ${PUBLISHER_OAUTH2_FRONTEND_URL:-https://myposts.pro}
      PUBLISHER_CORS_ALLOWED_ORIGINS_0: ${PUBLISHER_CORS_ALLOWED_ORIGINS_0:-https://myposts.pro}
      STORAGE_LOCAL_ROOT: /data/storage
      PUBLISHER_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      AI_INTEGRATION_BASE_URL: ${AI_INTEGRATION_BASE_URL:-}
      AI_INTEGRATION_API_KEY: ${AI_INTEGRATION_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - publisher_media:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_OAUTH_BASE_URL: ${VITE_OAUTH_BASE_URL:-https://myposts.pro}
    restart: unless-stopped
    environment:
      NGINX_PORT: 80
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    expose:
      - "80"

volumes:
  publisher_postgres_data:
  publisher_redis_data:
  publisher_media:
